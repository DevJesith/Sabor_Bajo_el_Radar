<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Finalizar Compra - SBR</title>
    <!-- CSRF Tokens para seguridad -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link th:href="@{/css/cliente/cliente-home.css}" rel="stylesheet">
    <link th:href="@{/css/cliente/carrito/finalizar-compra.css}" rel="stylesheet">
</head>
<body>
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center" href="/cliente">
            <img class="me-2" src="https://via.placeholder.com/40/ff6b35/FFFFFF?text=SBR" alt="SBR Logo">
            <span class="fw-bold">SBR</span>
        </a>
        <div class="checkout-steps d-none d-md-flex">
            <a class="step-item text-decoration-none" href="/carrito">
                <i class="fas fa-shopping-cart"></i><span>Carrito</span>
            </a>
            <div class="step-divider"></div>
            <div class="step-item active">
                <i class="fas fa-check-circle"></i><span>Confirmación</span>
            </div>
        </div>
    </div>
</nav>

<main>
    <div class="container py-5">
        <div class="row">
            <!-- COLUMNA IZQUIERDA: SELECCIÓN DE DATOS -->
            <div class="col-lg-7 mb-4">
                
                <!-- 1. Datos del Cliente (Solo lectura) -->
                <div class="checkout-section mb-4">
                    <h5 class="mb-3"><i class="fas fa-user-circle me-2 text-primary"></i>Datos de contacto</h5>
                    <div id="userInfoContainer" class="p-3 bg-light rounded border">
                        <div class="d-flex justify-content-center">
                            <div class="spinner-border text-primary spinner-sm" role="status"></div>
                        </div>
                    </div>
                </div>
                
                <!-- 2. Dirección de Entrega -->
                <div class="checkout-section mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="mb-0"><i class="fas fa-map-marker-alt me-2 text-danger"></i>¿Dónde entregamos?</h5>
                        <a class="btn btn-sm btn-outline-primary" href="/ubicacion">+ Nueva</a>
                    </div>
                    
                    <!-- Lista de direcciones cargadas -->
                    <div id="addressesContainer" class="selection-list">
                        <!-- Se llena con JS -->
                    </div>
                </div>
                
                <!-- 3. Método de Pago -->
                <div class="checkout-section mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="mb-0"><i class="fas fa-wallet me-2 text-success"></i>Método de pago</h5>
                        <a class="btn btn-sm btn-outline-success" href="/perfil-cliente">Gestionar tarjetas</a>
                    </div>
                    
                    <!-- Lista de métodos -->
                    <div id="paymentMethodsContainer" class="selection-list">
                        <!-- Se llena con JS -->
                    </div>
                    
                    <!-- Opciones de pago en efectivo/otros -->
                    <div class="mt-3 pt-3 border-top">
                        <div class="form-check payment-option-card">
                            <input id="payCash" class="form-check-input" name="selectedPayment" type="radio"
                                   value="EFECTIVO">
                            <label class="form-check-label w-100 d-flex align-items-center" for="payCash">
                                <i class="fas fa-money-bill-wave fs-4 me-3 text-success"></i>
                                <div>
                                    <strong>Efectivo</strong>
                                    <small class="d-block text-muted">Pagas al recibir el pedido</small>
                                </div>
                            </label>
                        </div>
                    </div>
                </div>
                
                <!-- 4. Nota del Pedido (MOVIDO AQUI) -->
                <div class="checkout-section">
                    <h5 class="mb-3"><i class="fas fa-sticky-note me-2 text-warning"></i>Nota para el restaurante
                        (Opcional)</h5>
                    <textarea id="orderNote" class="form-control" rows="2"
                              placeholder="Ej: Sin cebolla, la salsa aparte, timbre dañado..."></textarea>
                </div>
            
            </div>
            
            <!-- COLUMNA DERECHA: RESUMEN -->
            <div class="col-lg-5">
                <div class="summary-section sticky-top" style="top: 90px;">
                    <h4 class="mb-4">Resumen del pedido</h4>
                    
                    <div id="orderItems" class="order-items mb-4 pe-2"></div>
                    
                    <hr>
                    
                    <div class="summary-item">
                        <span>Subtotal</span>
                        <span id="checkoutSubtotal" class="fw-bold">$ 0</span>
                    </div>
                    <div class="summary-item">
                        <span>Envío</span>
                        <span id="checkoutShipping" class="fw-bold text-success">GRATIS</span>
                    </div>
                    
                    <hr>
                    
                    <div class="summary-item mb-4">
                        <span class="fs-4 fw-bold">Total</span>
                        <span id="checkoutTotal" class="fs-4 fw-bold text-primary">$ 0</span>
                    </div>
                    
                    <button class="btn btn-danger w-100 py-3 mb-3 fs-5 fw-bold" onclick="processOrder()">
                        Confirmar Pedido
                    </button>
                    
                    <div class="text-center text-muted small">
                        <i class="fas fa-lock me-1"></i> Transacción segura y encriptada
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- SweetAlert2 para alertas bonitas -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:src="@{/js/cliente/carrito/finalizar-compra.js}"></script>
</body>
</html>
