<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Mi Carrito - SBR</title>
    
    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link th:href="@{/css/cliente/cliente-home.css}" rel="stylesheet">
    <link th:href="@{/css/cliente/carrito/carrito-style.css}" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container-fluid px-4">
        <!-- Logo -->
        <a class="navbar-brand d-flex align-items-center" th:href="@{/cliente}">
            <img class="me-2" alt="SBR Logo" th:src="@{/img/logo_sbr.png}">
            <span class="fw-bold">SBR</span>
        </a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <div id="navbarContent" class="collapse navbar-collapse">
            <div class="d-flex align-items-center justify-content-between w-100">
                <!-- Buscador (Visual) -->
                <div class="search-wrapper mx-auto">
                    <input class="form-control search-input" type="search" placeholder="Buscar..."/>
                </div>
                
                <!-- Acciones -->
                <div class="nav-actions d-flex align-items-center gap-3">
                    <a class="nav-link d-flex align-items-center" th:href="@{/ubicacion}">
                        <i class="fas fa-map-marker-alt text-danger me-2"></i>
                        <span class="d-none d-lg-inline">Agregar ubicación</span>
                    </a>
                    
                    
                    <!-- Menú de Usuario -->
                    <div class="dropdown">
                        <button class="btn btn-link nav-link dropdown-toggle p-0" type="button"
                                data-bs-toggle="dropdown">
                            <span class="d-none d-lg-inline me-2">Hola, [nombre]</span>
                            <i class="fas fa-user-circle fs-4" style="color: var(--primary-orange)"></i>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" th:href="@{/perfil-cliente}"><i class="fas fa-user me-2"></i>Ver
                                perfil</a></li>
                            <li><a class="dropdown-item" th:href="@{/mis-pedidos}"><i class="fas fa-box me-2"></i>Mis
                                pedidos</a></li>
                            <li><a class="dropdown-item" th:href="@{/favoritos}"><i class="fas fa-heart me-2"></i>Favoritos</a>
                            </li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li>
                                <form th:action="@{/logout}" method="post">
                                    <button class="dropdown-item text-danger" type="submit"><i
                                        class="fas fa-sign-out-alt me-2"></i>Cerrar sesión
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</nav>

<main>
    <div class="container py-5">
        <div class="row">
            <!-- COLUMNA IZQUIERDA: ITEMS DEL CARRITO -->
            <div class="col-lg-7 mb-4">
                <div class="cart-section">
                    <h2 class="mb-4">Mi carrito</h2>
                    
                    <!-- Aquí JS inyecta los productos -->
                    <div id="cartItemsPage">
                        <!-- Loader inicial -->
                        <div class="text-center py-4">
                            <div class="spinner-border text-primary" role="status"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- COLUMNA DERECHA: RESUMEN -->
            <div class="col-lg-5">
                <div class="summary-section sticky-top" style="top: 100px;">
                    <h4 class="mb-4">Resumen del pedido</h4>
                    
                    <div class="summary-item">
                        <span>Subtotal</span>
                        <span id="subtotal" class="fw-bold">$ 0</span>
                    </div>
                    
                    <div class="summary-item">
                        <span>Envío</span>
                        <div class="text-end">
                            <span class="fw-bold text-success">GRATIS</span>
                            <small class="d-block text-muted" style="font-size: 0.8rem;">Bogotá, Colombia</small>
                        </div>
                    </div>
                    
                    <hr>
                    
                    <div class="summary-item mb-4">
                        <span class="fs-5 fw-bold">Total</span>
                        <span id="totalPrice" class="fs-4 fw-bold text-primary">$ 0</span>
                    </div>
                    
                    <button class="btn btn-danger w-100 py-3 mb-3 fs-5" onclick="goToCheckout()">
                        Finalizar compra
                    </button>
                    
                    <div class="text-center text-muted small">
                        <i class="fas fa-lock me-2"></i>Pago 100% seguro
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<footer class="footer mt-auto py-4 bg-light">
    <div class="container text-center">
        <p class="text-muted mb-0">© 2025 Sabor Bajo El Radar. Todos los derechos reservados.</p>
    </div>
</footer>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- SweetAlert2 (Importante para las alertas de confirmación) -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:src="@{/js/cliente/carrito/carrito-custom.js}"></script>

</body>
</html>
